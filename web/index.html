<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://*; img-src 'self'; base-uri 'none'; object-src 'none'">
  <title>Gruppe Sechs</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="minigame.js" defer></script>
  <script src="pinpad.js" defer></script>
  <script src="siren.js" defer></script>
  <script src="cylinder.js" defer></script>
  <script src="carwire.js" defer></script>
  <script src="lockpick.js" defer></script>
  <script src="shop.js" defer></script>
  <script src="live.js" defer></script>
</head>
<body>
  <main id="app" class="tablet" hidden aria-label="Gruppe Sechs">
    <aside class="sidebar">
      <div class="brand-lockup"><div id="monogram" class="monogram"></div><div><div id="brand" class="brand-name"></div><div id="edition" class="edition"></div></div></div>
      <div id="profile" class="profile"></div>
      <nav id="navigation" aria-label="Modulos"></nav>
      <div class="sidebar-footer"><span class="status-dot"></span><span id="session-label"></span><small id="expiry"></small></div>
    </aside>
    <section class="workspace">
      <header class="toolbar"><div><span id="overline" class="overline"></span><h1 id="heading"></h1></div><div class="toolbar-actions"><button id="refresh" class="quiet" type="button"></button><button id="close" class="close" type="button"></button></div></header>
      <div id="message" class="message" role="status" hidden></div>
      <div id="content" class="content"></div>
      <footer class="page-footer"><span id="footer-label"></span><div><button id="previous" type="button"></button><span id="page-label"></span><button id="next" type="button"></button></div></footer>
    </section>
  </main>
  <div id="minigame" class="minigame" hidden aria-live="polite"></div>
  <div id="cylinder" class="minigame" hidden aria-live="polite"></div>
  <div id="carwire" class="minigame" hidden aria-live="polite"></div>
  <div id="lockpick" class="minigame" hidden aria-live="polite"></div>
  <div id="shop" class="shop" hidden aria-label="Tienda Gruppe Sechs"></div>
  <div id="live" class="live" hidden aria-hidden="true"></div>
  <div id="pinpad" class="pinpad" hidden aria-label="Teclado de alarma"></div>
  <div id="viewfinder" class="viewfinder" hidden aria-hidden="true">
    <span class="vf-corner tl"></span><span class="vf-corner tr"></span><span class="vf-corner bl"></span><span class="vf-corner br"></span>
    <span class="vf-cross"></span>
    <div class="vf-top"><span id="vf-rec" class="vf-rec"></span><span id="vf-title" class="vf-title"></span></div>
    <div class="vf-bottom"><div id="vf-client" class="vf-client"></div><div id="vf-data" class="vf-data"></div><div id="vf-help" class="vf-help"></div></div>
    <span class="vf-flash"></span>
  </div>
</body>
</html>
