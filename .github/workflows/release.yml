# Publica una release de OS Security al subir una etiqueta de version (vX.Y.Z).
# Pasos: tests Lua, la etiqueta debe coincidir con config/config.lua y tener seccion en CHANGELOG.md,
# zip solo con los archivos del recurso y release con notas al estilo vMenu (commits desde la anterior).
# Tambien se puede lanzar a mano (Actions > Release > Run workflow) con una etiqueta ya subida para
# regenerar su release: si existe, se actualizan las notas y el zip.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta ya subida (por ejemplo v0.9.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar herramientas de test
        run: npm ci

      - name: Tests Lua
        run: npm test

      # Los scripts de publicacion salen de main: una etiqueta antigua tambien usa el formato actual.
      - name: Herramientas de publicacion
        run: git fetch origin main && git show origin/main:scripts/release.cjs > "$RUNNER_TEMP/release.cjs"

      - name: Comprobar version y changelog
        run: node "$RUNNER_TEMP/release.cjs" check "$TAG"

      - name: Empaquetar
        run: node "$RUNNER_TEMP/release.cjs" package

      - name: Notas de la release
        run: node "$RUNNER_TEMP/release.cjs" notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "OS Security $TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
            gh release upload "$TAG" dist/os_security-*.zip dist/os_security.zip --clobber
          else
            gh release create "$TAG" dist/os_security-*.zip dist/os_security.zip \
              --title "OS Security $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi
