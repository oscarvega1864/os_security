# Publica una release de OS Security al subir una etiqueta de version (vX.Y.Z).
# Pasos: tests Lua, la etiqueta debe coincidir con config/config.lua y tener seccion en CHANGELOG.md,
# zip solo con los archivos del recurso y release con notas (CHANGELOG + commits desde la anterior).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar herramientas de test
        run: npm ci

      - name: Tests Lua
        run: npm test

      - name: Comprobar version y changelog
        run: node scripts/release.cjs check "$GITHUB_REF_NAME"

      - name: Empaquetar
        run: node scripts/release.cjs package

      - name: Notas de la release
        run: node scripts/release.cjs notes "$GITHUB_REF_NAME" > dist/notes.md

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/os_security-*.zip \
            --title "OS Security $GITHUB_REF_NAME" \
            --notes-file dist/notes.md \
            --latest
